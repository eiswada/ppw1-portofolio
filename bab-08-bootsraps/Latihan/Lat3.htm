<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan 3 - Utility Classes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <!-- Sembunyikan elemen di layar kecil, tampilkan di layar md ke atas -->
  <div class="d-none d-md-block">Hanya tampil di tablet/desktop</div>

  <!-- Flexbox utilities -->
  <div class="d-flex justify-content-between align-items-center mt-3">
    <span>Kiri</span>
    <span>Kanan</span>
  </div>

  <!-- Gap antar flex items -->
  <div class="d-flex gap-3 mt-3">
    <button class="btn btn-primary">Tombol 1</button>
    <button class="btn btn-secondary">Tombol 2</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
