<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latihan 2 - Grid System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <!-- Struktur Dasar Grid -->
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        Konten Utama
      </div>
      <div class="col-md-4">
        Sidebar
      </div>
    </div>
  </div>

  <!-- Layout 3 kolom sama rata -->
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-4">Kolom 1</div>
      <div class="col-md-4">Kolom 2</div>
      <div class="col-md-4">Kolom 3</div>
    </div>
  </div>

  <!-- Layout responsif: 1 kolom di HP, 2 kolom di tablet, 3 di desktop -->
  <div class="container mt-4">
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4">Card 1</div>
      <div class="col-12 col-md-6 col-lg-4">Card 2</div>
      <div class="col-12 col-md-6 col-lg-4">Card 3</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
