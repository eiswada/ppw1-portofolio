<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 2 — Formulir Pendaftaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">AKADEMIK</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Pendaftaran</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container py-5 flex-grow-1">

    <div class="mb-4">
      <h1 class="fs-2 mb-1">Pendaftaran Mahasiswa Baru</h1>
      <p class="text-muted" style="font-size: 0.9rem;">Isi data diri dengan lengkap dan benar.</p>
    </div>

    <!-- Alert Sukses -->
    <div id="alertSukses" class="alert alert-success alert-dismissible fade show d-none" role="alert">
      ✓ Data berhasil disimpan. Pendaftaran kamu sudah kami terima.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Form Card -->
    <div class="card p-4">
      <p class="fw-semibold text-uppercase text-muted mb-3" style="font-size: 0.8rem; letter-spacing: 0.08em;">Data Diri</p>
      <div class="row g-3">

        <!-- Nama & NIM: 2 kolom -->
        <div class="col-12 col-md-6">
          <label for="nama" class="form-label">Nama Lengkap</label>
          <input type="text" id="nama" class="form-control is-valid" placeholder="Masukkan nama lengkap">
          <div class="valid-feedback">Nama terisi dengan benar.</div>
        </div>
        <div class="col-12 col-md-6">
          <label for="nim" class="form-label">NIM</label>
          <input type="text" id="nim" class="form-control is-invalid" placeholder="Contoh: 23010001">
          <div class="invalid-feedback">NIM wajib diisi dan harus berupa angka.</div>
        </div>

        <!-- Email -->
        <div class="col-12">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com">
        </div>

        <!-- Prodi & Semester: 2 kolom -->
        <div class="col-12 col-md-6">
          <label for="prodi" class="form-label">Program Studi</label>
          <select id="prodi" class="form-select">
            <option value="" disabled selected>Pilih program studi</option>
            <option>Teknik Informatika</option>
            <option>Sistem Informasi</option>
            <option>Ilmu Komputer</option>
            <option>Teknik Elektro</option>
          </select>
        </div>
        <div class="col-12 col-md-6">
          <label for="semester" class="form-label">Semester</label>
          <select id="semester" class="form-select">
            <option value="" disabled selected>Pilih semester</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </div>

        <!-- Alamat -->
        <div class="col-12">
          <label for="alamat" class="form-label">Alamat</label>
          <textarea id="alamat" class="form-control" rows="3" placeholder="Jalan, Kota, Provinsi"></textarea>
        </div>

        <!-- Foto -->
        <div class="col-12">
          <label for="foto" class="form-label">Foto Profil</label>
          <input type="file" id="foto" class="form-control" accept="image/*">
        </div>

        <!-- Tombol -->
        <div class="col-12 d-flex gap-2 mt-2">
          <button type="button" class="btn btn-dark" onclick="simpan()">Simpan</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3 mt-auto">
    <div class="container">
      <p class="text-center mb-0">&copy; 2024 Akademik. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function simpan() {
      document.getElementById('alertSukses').classList.remove('d-none');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function resetForm() {
      document.getElementById('alertSukses').classList.add('d-none');
      ['nama','nim','email','prodi','semester','alamat','foto'].forEach(id => {
        const el = document.getElementById(id);
        if (el.tagName === 'SELECT') el.selectedIndex = 0;
        else el.value = '';
      });
    }
  </script>
</body>
</html>
