<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      align-items: center;
    }

    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        gap: 10px;
      }
    }

    nav { border: 1px solid black; padding: 10px; }
    li { background: #eee; padding: 5px; }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li>Menu 1</li>
      <li>Menu 2</li>
      <li>Menu 3</li>
    </ul>
  </nav>

</body>
</html>
