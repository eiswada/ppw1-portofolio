<!DOCTYPE html>
<html>

<head>
  <title>Koral Restaurant - Table Reservation</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    body {
      background: #f0ece6;
      font-family: 'Lato', sans-serif;
      color: #1a1a1a;
      margin: 0;
    }

    .container {
      max-width: 540px;
      margin: 40px auto;
      background: white;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
    }

    .banner {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .header {
      background: #0a2535;
      padding: 18px 28px;
      border-bottom: 2px solid #c8a84b;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      color: #c8a84b;
      font-size: 20px;
      letter-spacing: 6px;
      margin: 0;
    }

    .header p {
      color: #7a9aaa;
      font-size: 12px;
      font-weight: 300;
      margin: 4px 0 0;
    }

    .body {
      padding: 28px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .side {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      padding: 8px 0;
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      color: #1a1a1a;
      outline: none;
    }

    textarea {
      border: 1px solid #ccc;
      padding: 8px;
      resize: none;
      background: #fafafa;
    }

    .side-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 18px 28px;
      background: #fafafa;
      border-top: 1px solid #eee;
    }

    input[type=submit] {
      background: #0a2535;
      color: #c8a84b;
      border: none;
      padding: 11px 28px;
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    input[type=reset] {
      background: white;
      color: #888;
      border: 1px solid #ccc;
      padding: 11px 18px;
      cursor: pointer;
    }

    .caption {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      padding: 14px;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="container">

    <img class="banner"
      src="https://storage.kempinski.com/cdn-cgi/image/w=1920,f=auto,fit=scale-down,g=auto/ki-cms-prod/images/8/6/4/3/17923468-2-eng-GB/c72da40793b5-84152385_4K.jpg"
      alt="Koral Restaurant Bali">

    <div class="header">
      <h1>K O R A L</h1>
      <p>The Apurva Kempinski Bali &mdash; Aquarium Fine Dining</p>
    </div>

    <form action="reservasi.php" method="post">
      <div class="body">

        <div class="row">
          <div class="field">
            <label>Name</label>
            <input type="text" name="nama" placeholder="Your full name">
          </div>
          <div class="field">
            <label>Phone</label>
            <input type="tel" name="telp" placeholder="+62 812 3456 7890">
          </div>
        </div>

        <div class="side">
          <div>
            <div class="field">
              <label>Date</label>
              <input type="date" name="tanggal">
            </div>
            <div class="field">
              <label>Session</label>
              <select name="sesi">
                <option value="">— Select —</option>
                <optgroup label="Lunch">
                  <option>12:00</option>
                  <option>13:00</option>
                </optgroup>
                <optgroup label="Dinner">
                  <option>18:00</option>
                  <option>19:30</option>
                  <option>20:30</option>
                </optgroup>
              </select>
            </div>
            <div class="field">
              <label>Guests</label>
              <input type="number" name="tamu" min="1" max="10" placeholder="2">
            </div>
          </div>
          <img class="side-img"
            src="https://storage.kempinski.com/cdn-cgi/image/w=585,h=775,f=auto,fit=cover,g=auto/ki-cms-prod/images/7/1/6/5/18265617-2-eng-GB/88d5fbf399e2-84153489_4K.jpg"
            alt="Koral Dining">
        </div>

        <div class="field">
          <label>Special Request</label>
          <textarea name="request" rows="3" placeholder="Dietary needs, occasion, accessibility..."></textarea>
        </div>

      </div>
      <div class="footer">
        <input type="reset" value="Clear">
        <input type="submit" value="CONFIRM RESERVATION">
      </div>
    </form>

    <p class="caption">Jl. Raya Nusa Dua Selatan, Nusa Dua, Bali &nbsp;&middot;&nbsp; +62 361 209 2288</p>
  </div>
</body>

</html>
